[project]
name = "tbamr"
version = "0.2.0"
description = "Hybrid agentic pipeline for TB drug-resistance genomic evidence (A.G.E.N.T. Playbook)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27", "python-multipart>=0.0.9", "anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `ui` runs headless Playwright against a backend-only uvicorn + a built frontend/dist bundle.
#   Default `pytest` skips them so first-time contributors don't need Chromium.
#   `pytest -m ui` runs only the UI tests. `pytest -m 'not ui'` is the fast path (default).
# `live` requires network access to the ENA Portal API and may be slow; opt-in only.
markers = [
  "ui: Playwright tests that drive the built React frontend in a headless browser",
  "live: tests that hit the real ENA Portal API over the network",
]
addopts = "-m 'not ui and not live'"
